[build-system]
requires = ["setuptools", "wheel"]

[project]
name = "watr_codec"
version = "0.1.0"
# semantic_objects uses `typing.Self`, which was added in Python 3.11
requires-python = ">=3.11"
dependencies = [
    "pype_schema>=0.7.0",
    "rdflib>=7.1.3",
    "semantic-mpc-interface @ git+https://github.com/lazlop/SemanticModelBuilder.git@develop",
    "semantic-objects @ git+https://github.com/lazlop/semantic_objects.git",
    # WORKAROUND: semantic-mpc-interface imports `brick_tq_shacl.topquadrant_shacl`,
    # which brick-tq-shacl 0.4.0 removed. Remove this pin once SemanticModelBuilder
    # switches to `from brick_tq_shacl import infer`.
    "brick-tq-shacl<0.4",
]
